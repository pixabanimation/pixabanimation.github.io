name: Auto Blog Writer

on:
  schedule:
    # Run Mon-Thu at 6:00 UTC (4 days on, 3 days off: Fri-Sun)
    - cron: '0 6 * * 1,2,3,4'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of trending articles to generate'
        required: true
        default: '5'
        type: choice
        options:
          - '3'
          - '5'
          - '10'
      force:
        description: 'Overwrite existing articles'
        required: false
        default: false
        type: boolean

jobs:
  generate-blog-articles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev
        continue-on-error: true

      - name: Generate trending blog articles
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          COUNT="${{ inputs.count || '5' }}"
          FORCE_FLAG="${{ inputs.force == true && '--force' || '' }}"
          node tools/ai-blog-writer.mjs --trending "$COUNT" $FORCE_FLAG

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet && git diff --staged --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push new articles
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "pixab-blog-bot"
          git config user.email "pixab-blog-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-generate blog articles from trending topics"
          git push
